<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smaragd – LARP ismertető (PDF)</title>
  <meta name="description" content="Smaragd LARP ismertető. Jelentkezés: admarszerepjatek@gmail.com">
  <style>
    html, body { height:100%; margin:0; }
    header{
      position:fixed; inset:0 0 auto 0; display:flex; gap:.75rem; align-items:center;
      padding:.6rem .9rem; border-bottom:1px solid #e5e5e5; background:#fff; z-index:10;
      font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    }
    header a{ color:#0d6efd; text-decoration:none }
    header .grow{ flex:1; color:#333 }
    .viewer{ position:fixed; inset:44px 0 0 0; width:100%; height:calc(100% - 44px); border:0 }
  </style>
</head>
<body>

  <header>
    <a href="./">← Vissza</a>
    <div class="grow">Smaragd – LARP ismertető (PDF)</div>
    <a id="dl" download>Letöltés</a>
  </header>

  <iframe class="viewer" id="frame" title="PDF néző"></iframe>

  <noscript>
    <p style="padding:1rem">A PDF megtekintéséhez
      <a href="smaragd.pdf" download>töltsd le a dokumentumot</a>.
    </p>
  </noscript>

  <script>
    // A PDF relatív útvonala (ha máshol van, itt írd át):
    const PDF_PATH = 'smaragd.pdf';

    // Abszolút URL a PDF-hez (a PDF.js viewernek ez kell):
    const pdfAbsUrl = new URL(PDF_PATH, location.href).href;

    // iOS detektálás
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua);

    // iOS-en PDF.js viewer, máshol natív beágyazás
    const frame = document.getElementById('frame');
    if (isIOS) {
      // Mozilla által hostolt PDF.js viewer
      frame.src = 'https://mozilla.github.io/pdf.js/web/viewer.html?file=' + encodeURIComponent(pdfAbsUrl);
    } else {
      frame.src = PDF_PATH + '#toolbar=1&navpanes=0';
    }

    // Letöltés gomb mindig közvetlenül a PDF-re mutat
    const dl = document.getElementById('dl');
    dl.href = PDF_PATH;
    dl.setAttribute('download', PDF_PATH.split('/').pop());
  </script>
</body>
</html>
